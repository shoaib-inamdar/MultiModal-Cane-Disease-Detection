# configs/obj1_cross_attention.yaml
# Objective 1: Cross-Attention Multimodal Fusion — Training Configuration

experiment:
  name: "obj1_cross_attention_v1"
  seed: 42

data:
  num_classes: 4
  class_names: ["Healthy", "Grassy Shoot", "Smut", "Pokkah Boeng"]
  image_size: 224
  metadata_dim: 4          # [Temperature, Humidity, Soil Moisture, Rainfall]
  batch_size: 32            # T4/A100 GPU can handle 32 comfortably
  num_synthetic_samples: 300
  synthetic: true           # Stage A -- dummy dataset
  synthetic_metadata: true  # Stage A -- synthetic metadata

model:
  backbone: "swin_tiny_patch4_window7_224"   # timm model name
  embed_dim: 768            # Swin-Tiny output dim
  metadata_hidden_dim: 128
  metadata_out_dim: 256
  num_attention_heads: 8
  fusion_dropout: 0.1

training:
  num_epochs: 30            # Increased: scheduler + augmentation benefit from more epochs
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 10              # Increased: gives model time to recover after LR drops

colab:
  use_drive: true
  drive_checkpoint_path: "/content/drive/MyDrive/SugarcaneAI/checkpoints"

logging:
  use_wandb: true           # W&B tracking enabled
  project: "sugarcane-ai-obj1"
  entity: "shoaibinamdar14-none"