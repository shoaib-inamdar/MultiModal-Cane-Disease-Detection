# CodeRabbit AI Code Review Configuration
# Docs: https://docs.coderabbit.ai

version: "2"

language: "en-US"

reviews:
  # Auto-review every pull request
  auto_review:
    enabled: true
    drafts: false

  # What CodeRabbit should focus on
  profile: "assertive"

  # Review settings
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Path-specific instructions
  path_instructions:
    - path: "agents/**"
      instructions: |
        This is an AI agent. Review for:
        - Safety: does it properly check permissions before taking action?
        - Error handling: what happens if the LLM returns bad output?
        - Clear separation of concerns between agents.

    - path: "core/**"
      instructions: |
        This is shared core code. Review for:
        - Reusability across all agents
        - Good type annotations
        - No hardcoded secrets or paths

    - path: "tests/**"
      instructions: |
        Review tests for:
        - Coverage of edge cases
        - Proper use of pytest fixtures
        - Meaningful assertion messages

chat:
  auto_reply: true