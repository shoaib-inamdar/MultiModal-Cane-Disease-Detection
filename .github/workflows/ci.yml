name: 🧪 CI — Test & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3

      - name: 📦 Install dependencies
        run: uv sync --extra dev

      - name: 🎨 Check code formatting (ruff)
        run: uv run ruff format --check src/ tests/ --exclude .venv

      - name: 🔍 Lint (ruff)
        run: uv run ruff check src/ tests/ --exclude .venv

      - name: 🏷️ Type check (mypy)
        run: uv run mypy src/ --exclude .venv
        continue-on-error: true  

      - name: 🧪 Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml

      - name: 🔗 Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short
        continue-on-error: true  # No integration tests yet — added in Phase 9

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
